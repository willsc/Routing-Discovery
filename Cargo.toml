[package]
name = "route-discovery"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Zero-configuration routing for AWS and on-prem networks, driving FRR"
license = "MIT"
publish = false

[features]
default = ["aws"]
# AWS SDK clients: EC2 (bgp role) and Direct Connect (dx role).
aws = ["dep:aws-config", "dep:aws-sdk-ec2", "dep:aws-sdk-directconnect"]

[dependencies]
async-trait = "0.1"
aws-config = { version = "1", optional = true, default-features = false, features = ["rustls", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-directconnect = { version = "1", default-features = false, features = ["rustls", "rt-tokio"], optional = true }
aws-sdk-ec2 = { version = "1", optional = true, default-features = false, features = ["rustls", "rt-tokio"] }
clap = { version = "4", features = ["derive"] }
fastrand = "2"
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
