# Separate configuration for the dynamic BGP-to-VPC control plane.
[server]
id = "production"
asn = 64512
region = "eu-west-2"
vpc_id = "vpc-0123456789abcdef0"
state_dir = "/var/lib/route-discovery-server"
listen = "127.0.0.1"
port = 9809
poll_interval = 1.0
reconcile_interval = 5.0
stale_after = 10.0
failback_delay = 10.0
persist_routes = false
persist_duration = 60.0
owner_tag = "route-discovery-server"

# Each endpoint is an independently configured local FRR instance/socket directory.
# Endpoint addresses/interfaces, FRR processes and AWS resources are pre-provisioned.
[[endpoints]]
id = "endpoint-a"
address = "10.0.1.5"
router_id = "10.0.1.5"
socket_dir = "/run/frr/endpoint-a"

[[endpoints]]
id = "endpoint-b"
address = "10.0.2.5"
router_id = "10.0.2.5"
socket_dir = "/run/frr/endpoint-b"

[[peers]]
id = "appliance-a"
endpoint = "endpoint-a"
address = "10.0.1.10"
asn = 65010
eni = "eni-0123456789abcdef0"
next_hops = ["10.0.1.10", "2001:db8:1::10"]
allowed_prefixes = ["10.20.0.0/16", "2001:db8:20::/48"]
local_pref = 100
max_prefixes = 100
bfd = true

[[peers]]
id = "appliance-b"
endpoint = "endpoint-b"
address = "10.0.2.10"
asn = 65020
eni = "eni-0fedcba9876543210"
next_hops = ["10.0.2.10", "2001:db8:2::10"]
allowed_prefixes = ["10.20.0.0/16", "2001:db8:20::/48"]
local_pref = 100
max_prefixes = 100
bfd = true

# Tag each table route-discovery-server=production before applying routes.
[[propagations]]
table = "rtb-0123456789abcdef0"
enabled = true
max_routes = 100

[[propagations]]
table = "rtb-0fedcba9876543210"
enabled = true
allowed_prefixes = ["10.20.0.0/16"]
max_routes = 100
